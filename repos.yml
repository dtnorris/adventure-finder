---
schema_version: adventurefinder-workspace/v0.1
workspace_root_default: /Users/davidnorris/code/adventure-finder-components

# `default: true` means normal bootstrap/status/sync/test operations include the
# repository. Historical/experimental repos remain documented but opt-in.
repositories:
  - name: md-specification-files
    github: dtnorris/md-specification-files
    role: Normative AdventureFinder specifications and semantic contracts.
    groups: [core, authority]
    lifecycle: current
    visibility: private
    default: true

  - name: af-xlsx-files-data
    github: dtnorris/af-xlsx-files-data
    role: Canonical AMC workbooks and PROJECT_STATE.yml moving-role authority.
    groups: [core, authority, data]
    lifecycle: current
    visibility: private
    default: true

  - name: af-source-md-data
    github: dtnorris/af-source-md-data
    role: Private canonical page-addressable Markdown corpus and source registry.
    groups: [core, authority, library]
    lifecycle: current
    visibility: private
    default: true
    notes:
      - Copyright-sensitive owned source material; keep private.

  - name: af-data-pipeline
    github: dtnorris/af-data-pipeline
    role: Deterministic source intake, boundary handoffs, AMC mutation, review, and finalization.
    groups: [core, code, ingest]
    lifecycle: current
    visibility: private
    default: true
    setup: bundle install
    test: bundle exec rake
    # One reported 2026-10-14 fast + integration run; priority hint, not a target.
    test_duration_hint_seconds: 104.11
    requires: [ruby, bundle, git]

  - name: af-cli-scoring-utility
    github: dtnorris/af-cli-scoring-utility
    role: Source-grounded AFAO assessment generation and scoring evidence.
    groups: [core, code, scoring]
    lifecycle: current
    visibility: private
    default: true
    setup: bundle install
    test: bundle exec rake test
    test_duration_hint_seconds: 1.57
    requires: [ruby, bundle, git]

  - name: af-workloads
    github: dtnorris/af-workloads
    role: Public AdventureFinder workload code, qualification policy, and model metadata.
    groups: [core, code, scoring, workloads]
    lifecycle: current
    visibility: public
    default: true
    setup: bundle install
    test: bundle exec rake
    requires: [ruby, bundle, git]

  - name: workload-orchestrator
    github: dtnorris/workload-orchestrator
    role: Generic execution plans, worker placement, readiness, scheduling, and execution state.
    groups: [code, execution, infrastructure]
    lifecycle: current
    visibility: public
    default: true
    setup: bundle install
    test: bundle exec rake
    requires: [ruby, bundle, git]
    notes:
      - Current/default supporting execution infrastructure; intentionally not tagged core.
      - Executes opaque jobs; AdventureFinder workload semantics remain in af-workloads.

  - name: runpod-ollama-fleet
    github: dtnorris/runpod-ollama-fleet
    role: RunPod/Ollama fleet lifecycle, readiness, safety, and generic remote dispatch.
    groups: [code, scoring, infrastructure]
    lifecycle: current
    visibility: public
    default: true
    setup: bundle install
    test: bundle exec rake
    test_duration_hint_seconds: 9.22
    requires: [ruby, bundle, git]
    notes:
      - Current/default supporting infrastructure; intentionally not tagged core.
      - Owns provider mechanics only; AdventureFinder inference intent remains outside this repository.

  - name: local-ollama-workers
    github: dtnorris/local-ollama-workers
    role: Explicit local Ollama capability bootstrap and provider-neutral worker publication.
    groups: [code, scoring, infrastructure]
    lifecycle: current
    visibility: public
    default: true
    setup: bundle install
    test: bundle exec rake
    requires: [ruby, bundle, git]
    notes:
      - Publishes observed local capacity; it does not schedule work or resolve workload aliases.

  - name: af-frontier-pack
    github: dtnorris/af-frontier-pack
    role: Deterministic consumption bridge from canonical artifacts to frontier-model reasoning packs.
    groups: [core, code, consumption]
    lifecycle: current
    visibility: private
    default: true
    setup: bundle install
    test: bundle exec rake
    test_duration_hint_seconds: 0.59
    requires: [ruby, bundle, git]

  - name: af-cli-query-matcher
    github: dtnorris/af-cli-query-matcher
    role: AFPS parsing plus deterministic filtering/ranking runtime.
    groups: [code, matcher]
    lifecycle: current
    visibility: private
    default: true
    setup: bundle install
    test: bundle exec rake test
    test_duration_hint_seconds: 2.06
    requires: [ruby, bundle, git]

  - name: pdf-to-llm-md-converter
    github: dtnorris/pdf-to-llm-md-converter
    role: Deterministic PDF-to-page-addressable-Markdown conversion.
    groups: [code, ingest]
    lifecycle: current
    visibility: public
    default: true
    setup: bin/setup
    test: PATH="$PWD/.venv/bin:$PATH" bundle exec rake test
    test_duration_hint_seconds: 0.86
    requires: [ruby, bundle, git]
    optional_runtime_requires: [python3, pdfinfo, pdfseparate, pdftotext, pdftoppm, qpdf, tesseract]
    notes:
      - bin/setup creates/reuses the repository-local .venv and installs Docling there; system tools remain external prerequisites.

  - name: image-to-pdf-converter
    github: dtnorris/image-to-pdf-converter
    role: Conservative physical-book photo normalization into image-only PDFs.
    groups: [code, ingest]
    lifecycle: current
    visibility: public
    default: true
    setup: bin/setup
    test: PATH="$PWD/.venv/bin:$PATH" bundle exec rake test
    test_duration_hint_seconds: 2.38
    requires: [ruby, bundle, git]
    optional_runtime_requires: [python3, img2pdf]
    notes:
      - bin/setup creates/reuses the repository-local .venv and installs the checked-in Python requirements there.

  - name: llm-response-data
    github: dtnorris/llm-response-data
    role: Historical/raw AdventureFinder evidence archive; never project-state authority.
    groups: [evidence, data]
    lifecycle: current
    visibility: private
    default: true
    clone_depth: 1
    notes:
      - Shallow-cloned by default because this repository is materially larger than the other AdventureFinder repositories.
      - Run `git fetch --unshallow` inside the repository only when historical Git traversal is actually needed.

  - name: 5e-tools-corpus-converter
    location: adjacent
    github: dtnorris/5e-tools-corpus-converter
    role: Earlier local-5e.tools corpus-conversion spike retained for reference.
    groups: [code, experimental]
    lifecycle: experimental
    visibility: private
    default: false
    setup: bundle install
    test: bundle exec rake test
    requires: [ruby, bundle, git]

  - name: af-corpus-ingester-basics
    location: adjacent
    github: dtnorris/af-corpus-ingester-basics
    role: Superseded deterministic candidate-ingestion prototype.
    groups: [code, archive]
    lifecycle: archived
    visibility: private
    default: false
    setup: bundle install
    test: bundle exec rake
    requires: [ruby, bundle, git]

  - name: af-matcher-cli
    location: adjacent
    github: dtnorris/af-matcher-cli
    role: Completed direct-LLM recommendation experiment retained for reproducibility.
    groups: [code, archive]
    lifecycle: archived
    visibility: private
    default: false
    setup: bundle install
    test: bin/test
    requires: [ruby, bundle, git]
